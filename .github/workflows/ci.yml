name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          sw_vers
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Check the SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDK: $SDK"
          ls "$SDK/System/Library/Frameworks/IOKit.framework/Headers/scsi/SCSITaskLib.h"
          if [ -d "$SDK/System/Library/Frameworks/DiscRecording.framework" ]; then
            echo "DiscRecording: in the SDK"
          else
            echo "DiscRecording: not in the SDK"
          fi

      - name: Build
        run: swift build --package-path Packages/BurnKit -Xswiftc -warnings-as-errors

      - name: Test
        run: |
          set -o pipefail
          if ! swift test --package-path Packages/BurnKit -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            # One annotation with every failing line, so failures show without the full log.
            FAILURES="$(grep -E "✘|error:|recorded an issue|Expectation failed|Fatal error|Precondition failed" "$RUNNER_TEMP/test.log" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Failing tests::$FAILURES"
            exit 1
          fi

      - name: Build the app
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild build -project Burn.xcodeproj -scheme Burn -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" > "$LOG" 2>&1; then
            # The compiler's messages are far from the end of the log, so show them first, and as
            # annotations, which can be read without the log.
            grep -E "(error|warning): " "$LOG" | sort -u | head -20 | while IFS= read -r line; do
              echo "::error title=App build::$line"
            done || true
            grep -E "(error|warning): " "$LOG" | sort -u || true
            tail -40 "$LOG"
            exit 1
          fi
          tail -20 "$LOG"

      - name: ISO round trip through macOS
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/src/Test Data"
          mkdir -p "$SRC/sub dir/deeper/a/b"
          printf 'hello\n' > "$SRC/hello.txt"
          : > "$SRC/empty"
          head -c 3000000 /dev/urandom > "$SRC/sub dir/random.bin"
          printf 'accents\n' > "$SRC/sub dir/deeper/Café résumé.txt"
          printf 'deep\n' > "$SRC/sub dir/deeper/a/b/deep.txt"
          printf 'long\n' > "$SRC/$(printf 'L%.0s' $(seq 1 90)).txt"
          swift run --package-path Packages/BurnKit burnctl make-iso "$SRC" --output "$RUNNER_TEMP/test.iso" --name "Round Trip"
          MNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$RUNNER_TEMP/test.iso"
          mount | grep "$MNT"
          # A bridge image must mount as UDF, which macOS prefers when it can read it.
          mount | grep "$MNT" | grep -q "(udf"
          ls -laR "$MNT"
          python3 scripts/compare-trees.py "$SRC" "$MNT"
          # The checksum folder must check out with plain shasum, as it will years from now.
          (cd "$MNT" && shasum -a 256 -c .burn/SHA256SUMS)
          cat "$MNT/.burn/info.json"
          swift run --package-path Packages/BurnKit burnctl verify-files "$MNT"
          hdiutil detach "$MNT"

          # Without UDF, the same files through ISO 9660 and Joliet.
          swift run --package-path Packages/BurnKit burnctl make-iso "$SRC" --output "$RUNNER_TEMP/plain.iso" --name "Plain" --no-udf
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$RUNNER_TEMP/plain.iso"
          mount | grep "$MNT" | grep -q "(cd9660"
          python3 scripts/compare-trees.py "$SRC" "$MNT"
          (cd "$MNT" && shasum -a 256 -c .burn/SHA256SUMS)
          hdiutil detach "$MNT"

      - name: Recovery data works with par2
        run: |
          set -euo pipefail
          brew install par2 > /dev/null
          LOG="$RUNNER_TEMP/par2.log"
          # Show par2's own words as an annotation if any step fails.
          trap 'echo "::error title=par2::$(tail -40 "$LOG" | sed "s/%/%25/g" | awk "{printf \"%s%%0A\", \$0}")"' ERR
          MNT="$RUNNER_TEMP/mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$RUNNER_TEMP/test.iso"
          ls -la "$MNT/.burn"
          par2 verify "-B$MNT" "$MNT/.burn/recovery.par2" >> "$LOG" 2>&1
          COPY="$RUNNER_TEMP/copy"
          cp -R "$MNT" "$COPY"
          hdiutil detach "$MNT"
          chmod -R u+w "$COPY"
          # Damage 100 KB in the middle of one file and delete another, then repair.
          dd if=/dev/zero of="$COPY/sub dir/random.bin" bs=1024 seek=1000 count=100 conv=notrunc 2> /dev/null
          rm "$COPY/hello.txt"
          if par2 verify "-B$COPY" "$COPY/.burn/recovery.par2" >> "$LOG" 2>&1; then
            echo "par2 didn't notice the damage" >> "$LOG"
            false
          fi
          par2 repair "-B$COPY" "$COPY/.burn/recovery.par2" >> "$LOG" 2>&1
          (cd "$COPY" && shasum -a 256 -c .burn/SHA256SUMS)
          python3 scripts/compare-trees.py "$RUNNER_TEMP/src/Test Data" "$COPY" || {
            # par2 keeps the damaged file as random.bin.1, which compare-trees reports.
            find "$COPY" -name "*.1" -delete
            python3 scripts/compare-trees.py "$RUNNER_TEMP/src/Test Data" "$COPY"
          }

      - name: Repair with burnctl
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/src/Test Data"
          damage() {
            dd if=/dev/zero of="$1/sub dir/random.bin" bs=1024 seek=1000 count=100 conv=notrunc 2> /dev/null
            rm "$1/hello.txt"
          }
          # Our own recovery data.
          MNT="$RUNNER_TEMP/mnt"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$RUNNER_TEMP/test.iso"
          DISC="$RUNNER_TEMP/damaged"
          cp -R "$MNT" "$DISC"
          hdiutil detach "$MNT"
          chmod -R u+w "$DISC"
          damage "$DISC"
          swift run --package-path Packages/BurnKit burnctl repair "$DISC" --output "$RUNNER_TEMP/repaired"
          (cd "$RUNNER_TEMP/repaired" && shasum -a 256 -c .burn/SHA256SUMS)
          python3 scripts/compare-trees.py "$SRC" "$RUNNER_TEMP/repaired"

          # Recovery data made by par2 itself, so the repair is checked against another encoder.
          REF="$RUNNER_TEMP/reference"
          cp -R "$SRC" "$REF"
          mkdir "$REF/.burn"
          (cd "$REF" && find . -type f ! -path "./.burn/*" | sed 's|^\./||' | sort | while IFS= read -r f; do shasum -a 256 "$f"; done > .burn/SHA256SUMS)
          (cd "$REF" && find . -type f ! -path "./.burn/*" -print0 | xargs -0 par2 create -q -s4096 -r20 "-B$REF" .burn/recovery.par2)
          damage "$REF"
          swift run --package-path Packages/BurnKit burnctl repair "$REF" --output "$RUNNER_TEMP/reference-repaired"
          (cd "$RUNNER_TEMP/reference-repaired" && shasum -a 256 -c .burn/SHA256SUMS)

      - name: Recovery data speed
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/speed"
          mkdir -p "$SRC"
          head -c 268435456 /dev/urandom > "$SRC/random.bin"
          swift build -c release --package-path Packages/BurnKit --product burnctl > /dev/null
          BURNCTL="$(swift build -c release --package-path Packages/BurnKit --show-bin-path)/burnctl"
          for percent in 0 10; do
            OUT="$("$BURNCTL" make-iso "$SRC" --output "$RUNNER_TEMP/speed.iso" --name Speed --recovery "$percent")"
            echo "$OUT"
            echo "::notice title=Recovery speed, 256 MB at ${percent}% on $(sysctl -n hw.ncpu) cores::$(echo "$OUT" | grep seconds)"
          done
          rm -rf "$SRC" "$RUNNER_TEMP/speed.iso"

      - name: Keep the test image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: ${{ runner.temp }}/test.iso
          retention-days: 7
          if-no-files-found: ignore

      - name: A file over 4 GB through macOS
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          SRC="$RUNNER_TEMP/big"
          mkdir -p "$SRC"
          # 4 GiB and 1 MiB, each MiB filled with its own number, so misplaced pieces would show.
          python3 -c "
          import struct, sys
          with open(sys.argv[1], 'wb') as f:
              for i in range(4097):
                  f.write(struct.pack('<Q', i) * 131072)
          " "$SRC/big.bin"
          printf 'small\n' > "$SRC/small.txt"
          EXPECTED="$(shasum -a 256 "$SRC/big.bin" | cut -d' ' -f1)"
          # Recovery data for 4 GB takes minutes in a debug build; the speed step measures it.
          swift run --package-path Packages/BurnKit burnctl make-iso "$SRC" --output "$RUNNER_TEMP/big.iso" --name "Big" --recovery 0
          rm "$SRC/big.bin"
          MNT="$RUNNER_TEMP/bigmnt"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$RUNNER_TEMP/big.iso"
          mount | grep "$MNT" | grep -q "(udf"
          ls -la "$MNT"
          test "$(stat -f %z "$MNT/big.bin")" = 4296015872
          test "$(shasum -a 256 "$MNT/big.bin" | cut -d' ' -f1)" = "$EXPECTED"
          (cd "$MNT" && shasum -a 256 -c .burn/SHA256SUMS)
          hdiutil detach "$MNT"
          rm "$RUNNER_TEMP/big.iso"

      - name: Simulated burn of the same files
        run: |
          set -euo pipefail
          for profile in cd-r dvd-r dvd+r bd-r; do
            swift run --package-path Packages/BurnKit burnctl simulate-burn "$RUNNER_TEMP/src/Test Data" --profile "$profile"
          done
