name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Check the SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDK: $SDK"
          ls "$SDK/System/Library/Frameworks/IOKit.framework/Headers/scsi/SCSITaskLib.h"
          if [ -d "$SDK/System/Library/Frameworks/DiscRecording.framework" ]; then
            echo "DiscRecording: in the SDK"
          else
            echo "DiscRecording: not in the SDK"
          fi

      - name: Build
        if: hashFiles('Packages/BurnKit/Package.swift') != ''
        run: swift build --package-path Packages/BurnKit -Xswiftc -warnings-as-errors

      - name: Test
        if: hashFiles('Packages/BurnKit/Package.swift') != ''
        run: swift test --package-path Packages/BurnKit -Xswiftc -warnings-as-errors
